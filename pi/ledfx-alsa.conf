# LedFx capture PCM (installed to /etc/alsa/conf.d/60-ledfx.conf by
# ledfx-install.sh). The loopback locks its second opener to the first one's
# parameters, and LedFx opens its input mono: read hw:Loopback,1,0 directly
# and Mixxx's 2-channel Booth is refused with "invalid number of channels".
# This plug holds the loopback at Booth's 2 channels / 44100 Hz and downmixes
# to whatever LedFx asks for. Pick "ALSA: ledfx_in" as LedFx's audio device.
pcm.ledfx_in {
    type plug
    slave {
        pcm "hw:Loopback,1,0"
        channels 2
        rate 44100
    }
    ttable.0.0 0.5
    ttable.0.1 0.5
    hint.description "LedFx input (Mixxx Booth via loopback)"
}
