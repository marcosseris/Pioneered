# ALSA loopback for LedFx (installed to /etc/modprobe.d/ by ledfx-install.sh).
# Mixxx's Booth output plays into hw:Loopback,0,0 and LedFx captures the same
# audio from hw:Loopback,1,0. The fixed index keeps the loopback out of card
# 0/1 so it can never renumber the DDJ-400 that Mixxx opens by hw: number.
options snd-aloop index=10 id=Loopback pcm_substreams=1
